# ==============================================================================
# NETRA SHAKTI // Official Render Blueprint Specification
# Tagline: TRACE THE ORIGIN, PROVE THE TRUTH
# DEFENCE-Grade Cybersecurity & Cryptographic Attribution Platform
# ==============================================================================

version: "1"

databases:
  - name: netra-shakti-db
    databaseName: netrashakti
    user: netra_admin
    plan: free
    region: oregon

services:
  - type: web
    name: netra-shakti-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /api/v1/system/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: netra-shakti-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: MASTER_ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: FRONTEND_URL
        value: "https://netra-shakti-jy7p.vercel.app"
      - key: SUPERADMIN_USERNAME
        value: "netra.admin"
      - key: SUPERADMIN_EMAIL
        value: "admin@defence.netrashakti.gov"
      - key: SUPERADMIN_PASSWORD
        value: "Netra@Shakti2026!Defence"
