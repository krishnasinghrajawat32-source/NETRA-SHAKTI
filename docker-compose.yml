version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: netra-shakti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
      POSTGRES_DB: netra_shakti
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: netra-shakti-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: netra-shakti-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./apps/ml-service
      dockerfile: Dockerfile
    container_name: netra-shakti-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
    depends_on:
      - postgres

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: netra-shakti-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://postgres:postgrespassword2026@postgres:5432/netra_shakti?schema=public"
      REDIS_URL: "redis://redis:6379"
      MINIO_ENDPOINT: "minio"
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadminpassword2026"
      MINIO_BUCKET: "netra-shakti-documents"
      ML_SERVICE_URL: "http://ml-service:8000"
      JWT_SECRET: "netra-shakti-defense-jwt-access-secret-super-safe-2026"
      REFRESH_SECRET: "netra-shakti-defense-jwt-refresh-secret-super-safe-2026"
      MASTER_KEY: "netra-shakti-defense-grade-master-key-2026-secure"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: netra-shakti-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
